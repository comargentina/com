<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer glow/circle -->
  <circle cx="50" cy="50" r="46" fill="#059669" fill-opacity="0.1" stroke="#059669" stroke-width="3"/>
  <!-- Butterfly Left Wing Top -->
  <path d="M47 48 C30 20, 10 28, 15 50 C18 64, 40 55, 47 50 Z" fill="url(#wingLeftTop)" />
  <!-- Butterfly Right Wing Top -->
  <path d="M53 48 C70 20, 90 28, 85 50 C82 64, 60 55, 53 50 Z" fill="url(#wingRightTop)" />
  <!-- Butterfly Left Wing Bottom -->
  <path d="M46 52 C30 54, 18 68, 28 80 C40 88, 46 64, 47 54 Z" fill="url(#wingLeftBottom)" />
  <!-- Butterfly Right Wing Bottom -->
  <path d="M54 52 C70 54, 82 68, 72 80 C60 88, 54 64, 53 54 Z" fill="url(#wingRightBottom)" />
  <!-- Body -->
  <ellipse cx="50" cy="52" rx="3" ry="18" fill="#064E3B" />
  <circle cx="50" cy="32" r="4" fill="#064E3B" />
  <!-- Antennae -->
  <path d="M49 30 Q42 18, 36 16" stroke="#064E3B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="36" cy="16" r="1.5" fill="#064E3B" />
  <path d="M51 30 Q58 18, 64 16" stroke="#064E3B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="64" cy="16" r="1.5" fill="#064E3B" />

  <!-- Gradients -->
  <defs>
    <linearGradient id="wingLeftTop" x1="10" y1="20" x2="47" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="wingRightTop" x1="90" y1="20" x2="53" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="wingLeftBottom" x1="18" y1="54" x2="47" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="wingRightBottom" x1="82" y1="54" x2="53" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
</svg>
